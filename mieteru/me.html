<!doctype html>
<html lang="ja">
<head>
<!-- PATCH-2026-05-20-MIETERU -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIミエテル — マイページ</title>
<style>
:root { --bg:#0b0b14; --card:#1a1a2a; --text:#e8e8f0; --muted:#9090a8;
        --primary:#bc42ff; --accent:#14b4e6; --green:#22c55e; --border:#2a2a3a; }
html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif; margin:0; padding:0; }
.wrap { max-width:560px; margin:0 auto; padding:24px 16px 80px; }
.header { display:flex; align-items:center; gap:10px; padding:12px 4px 24px; }
.header .logo { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:grid; place-items:center; font-weight:800; color:#fff; }
.header .title { font-weight:700; font-size:18px; } .header .sub { color:var(--muted); font-size:12px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin:14px 0; }
.score { font-size:32px; font-weight:800; }
.score .total { color:var(--accent); } .label { color:var(--muted); font-size:13px; margin-top:4px; }
.row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); }
.row:first-of-type { border-top:none; } .row .k { color:var(--muted); } .row .v { font-weight:600; }
.cta { display:block; width:100%; padding:16px; border-radius:12px; border:none; cursor:pointer; font-weight:700; font-size:16px; text-align:center; text-decoration:none; box-sizing:border-box; }
.cta-primary { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; margin-top:8px; }
.cta-primary[disabled] { opacity:0.6; cursor:not-allowed; }
.cta-secondary { background:transparent; color:var(--muted); border:1px solid var(--border); margin-top:10px; }
.note { color:var(--muted); font-size:12px; line-height:1.5; margin-top:14px; text-align:center; }
.success-banner { background:rgba(34,197,94,0.15); border:1px solid var(--green); color:#a6efbe; padding:12px 14px; border-radius:10px; margin-bottom:16px; font-size:14px; }
.error-banner { background:rgba(239,68,68,0.15); border:1px solid #ef4444; color:#ffb4b4; padding:12px 14px; border-radius:10px; margin-bottom:16px; font-size:14px; }
.spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:6px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">S</div>
    <div>
      <div class="title">AIミエテル — マイページ</div>
      <div class="sub">by SEOAI</div>
    </div>
  </div>

  <div id="paid-banner" style="display:none" class="success-banner">
    ✅ クレジットカードのご登録が完了しました！ AIミエテルページを公開できます。
  </div>
  <div id="cancel-banner" style="display:none" class="error-banner">
    ⚠️ 決済がキャンセルされました。もう一度お試しください。
  </div>

  <div class="card">
    <div class="label">あなたのミエテル度</div>
    <div class="score"><span id="score-overall" class="total">--</span><span style="color:var(--muted);font-size:20px;">/100点</span></div>
    <div class="label" id="score-detail">AI: -- / Web: --</div>
  </div>

  <div class="card">
    <div style="font-weight:700; margin-bottom:6px;" id="biz-name">あなたのビジネス</div>
    <div class="row"><span class="k">業種</span><span class="v" id="biz-industry">—</span></div>
    <div class="row"><span class="k">所在地</span><span class="v" id="biz-location">—</span></div>
    <div class="row"><span class="k">電話番号</span><span class="v" id="biz-phone">—</span></div>
    <div class="row"><span class="k">サイト</span><span class="v" id="biz-domain">—</span></div>
  </div>

  <button id="publish-btn" class="cta cta-primary" onclick="startCheckout()">
    💳 クレジットカードを登録して公開する
  </button>
  <div class="note">
    今月は完全無料・2ヶ月目から月額 ¥2,980。<br>
    Stripe で安全に決済情報をお預かりします。<br>
    いつでも解約可能・トライアル中の解約は料金がかかりません。
  </div>

  <a class="cta cta-secondary" href="/mieteru">トップに戻る</a>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get("t") || "";
  if (!token) {
    document.querySelector(".wrap").innerHTML =
      '<div class="error-banner">セッションが見つかりません。' +
      '<a style="color:#fff" href="/mieteru/demo">最初からやり直す</a></div>';
    return;
  }

  if (params.get("paid") === "1") {
    document.getElementById("paid-banner").style.display = "block";
    document.getElementById("publish-btn").textContent = "✨ ページを公開する";
    document.getElementById("publish-btn").onclick = function () { publishPage(); };
  } else if (params.get("paid") === "cancelled") {
    document.getElementById("cancel-banner").style.display = "block";
  }

  // PATCH-2026-05-21-MIETERU-PUBLISH: real publish into the SEOAI public
  // profile system (seoai.space/p/<slug>/), not a placeholder alert.
  window.publishPage = async function () {
    const btn = document.getElementById("publish-btn");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>公開中...';
    try {
      const profile = JSON.parse(sessionStorage.getItem("mieteru_profile") || "{}");
      const diag = JSON.parse(sessionStorage.getItem("mieteru_diag") || "{}");
      if (diag.input_url && !profile.source_url) profile.source_url = diag.input_url;
      const res = await fetch("/api/mieteru/publish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, profile: profile }),
      });
      const data = await res.json();
      if (data.ok && data.public_url) {
        const banner = document.getElementById("paid-banner");
        banner.style.display = "block";
        banner.innerHTML =
          '🎉 公開しました！ あなたのAIミエテルページ：<br>' +
          '<a id="public-url-link" href="' + data.public_url + '" target="_blank" rel="noopener" ' +
          'style="color:#fff; word-break:break-all; text-decoration:underline;">' +
          data.public_url + '</a>';
        btn.innerHTML = '🔗 公開ページを開く';
        btn.disabled = false;
        btn.onclick = function () { window.open(data.public_url, "_blank"); };
        // Add a Copy URL button below
        if (!document.getElementById("copy-url-btn")) {
          const copyBtn = document.createElement("button");
          copyBtn.id = "copy-url-btn";
          copyBtn.className = "cta cta-secondary";
          copyBtn.textContent = "📋 URLをコピー";
          copyBtn.onclick = function () {
            navigator.clipboard.writeText(data.public_url).then(function () {
              copyBtn.textContent = "✅ コピーしました";
              setTimeout(function () { copyBtn.textContent = "📋 URLをコピー"; }, 2000);
            });
          };
          btn.parentNode.insertBefore(copyBtn, btn.nextSibling);
        }
      } else {
        alert(data.error || "公開できませんでした。サポート (info@blocksky.xyz) までご連絡ください。");
        btn.disabled = false;
        btn.innerHTML = original;
      }
    } catch (e) {
      alert("通信エラーが発生しました。もう一度お試しください。");
      btn.disabled = false;
      btn.innerHTML = original;
    }
  };

  // Hydrate from sessionStorage seeded by /mieteru/demo.
  try {
    const diag = JSON.parse(sessionStorage.getItem("mieteru_diag") || "{}");
    const profile = JSON.parse(sessionStorage.getItem("mieteru_profile") || "{}");
    if (diag.ai_score != null && diag.web_score != null) {
      const overall = Math.round(((diag.ai_score || 0) + (diag.web_score || 0)) / 2);
      document.getElementById("score-overall").textContent = overall;
      document.getElementById("score-detail").textContent =
        "AI: " + Math.round(diag.ai_score || 0) + " / Web: " + Math.round(diag.web_score || 0);
    }
    if (profile.name) document.getElementById("biz-name").textContent = profile.name;
    if (profile.industry) document.getElementById("biz-industry").textContent = profile.industry;
    if (profile.location) document.getElementById("biz-location").textContent = profile.location;
    if (profile.phone) document.getElementById("biz-phone").textContent = profile.phone;
    if (diag.input_url) document.getElementById("biz-domain").textContent = diag.input_url;
  } catch (_) {}

  window.startCheckout = async function () {
    const btn = document.getElementById("publish-btn");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>決済画面を準備中...';
    try {
      const res = await fetch("/api/mieteru/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token }),
      });
      const data = await res.json();
      if (data.ok && data.checkout_url) {
        location.href = data.checkout_url;
      } else {
        alert(data.error || "決済画面を開けませんでした。サポートまでご連絡ください。");
        btn.disabled = false;
        btn.innerHTML = original;
      }
    } catch (e) {
      alert("通信エラーが発生しました。もう一度お試しください。");
      btn.disabled = false;
      btn.innerHTML = original;
    }
  };
})();
</script>
</body>
</html>
